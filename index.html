function partyForm(i){if(!canMaintain())return;let client=partyKind==='客户',p=i<0?{code:'',name:'',contact:'',phone:'',address:'',store:'杭州展厅',owner:'林予安',notes:'',type:'打样合作厂',craft:'',gauge:'',days:7,status:client?'合作中':'启用'}:(client?customers:factories)[i];modal((i<0?'新增':'编辑')+partyKind,`<div class="fields">${field('partyCode','编号 *',p.code)}${field('partyName','名称 *',p.name)}${field('partyPerson','联系人 *',p.contact)}${field('partyPhone','电话',p.phone)}<div class="field full"><label for="partyAddress">${client?'收货 / 寄样地址':'厂家地址'}</label><input id="partyAddress" value="${safe(p.address)}"></div>${client?`${field('partyStore','归属门店',p.store)}${field('partyOwner','对接店员',p.owner)}`:`<div class="field"><label for="partyType">厂家类型</label><select id="partyType">${['本厂','外发加工厂','打样合作厂'].map(t=>`<option ${t===p.type?'selected':''}>${t}</option>`).join('')}</select></div>${field('partyDays','常规打样天数',p.days,'number')}${field('partyCraft','承接工序',p.craft)}${field('partyGauge','支持针型',p.gauge)}`}<div class="field full"><label for="partyNotes">${client?'合作要求':'加工备注'}</label><textarea id="partyNotes">${safe(p.notes)}</textarea></div></div><p id="partnerError" class="error"></p>`,'保存演示资料',`saveParty(${i})`)}

function samplesPage(){let a=sampleAccess();return header('SAMPLE DEVELOPMENT','样衣与打样','从客户需求到最终封样，每一版都有清楚的记录。',sampleEdit()?`<button class="primary" onclick="newSample()">${icon('plus')}新建打样需求</button>`:'')+`<div class="summary"><article><div><label>开发中的样衣</label><strong>${a.filter(s=>s.stage<6).length}<small>款</small></strong><footer>工艺、制作、确认全过程</footer></div>${icon('sample')}</article><article><div><label>待客户确认</label><strong>${a.filter(s=>s.stage===5).length}<small>款</small></strong><footer>确认通过后方可封样</footer></div>${icon('check')}</article><article><div><label>封样 / 借出</label><strong>${a.filter(s=>s.stage===6).length} / ${a.filter(s=>s.loan).length}</strong><footer>样衣位置与去向可查</footer></div>${icon('shipping')}</article></div><section class="panel"><div class="panelhead"><div class="tabs">${['全部样衣','开发中','待确认','已封样','借出中'].map(t=>`<button class="${sampleFilter===t?'active':''}" onclick="sampleFilter='${t}';go('samples')">${t}</button>`).join('')}</div><span class="tag gray">一款多版 · 留存历史</span></div><div class="samplecards">${a.map(s=>({s,i:samples.indexOf(s)})).filter(({s})=>sampleFilter==='全部样衣'||sampleFilter==='开发中'&&s.stage<5||sampleFilter==='待确认'&&s.stage===5||sampleFilter==='已封样'&&s.stage===6||sampleFilter==='借出中'&&s.loan).map(({s,i})=>`<article class="samplecard"><div class="sampletop"><div class="thumb">${icon('bom')}</div><div><span class="tag ${s.stage===5?'amber':s.stage===6?'':'gray'}">${sampleStages[s.stage]}</span><h2>${safe(styleData[s.style].name)}</h2><p>${s.code} / 第 ${s.version} 版</p></div></div><div class="samplefacts"><div><label>客户</label><b>${safe(customers[s.customer].name)}</b></div><div><label>承接厂家</label><b>${safe(factories[s.factory].name)}</b></div><div><label>样衣规格</label><b>${safe(s.color)} / ${s.size} / ${s.qty} 件</b></div><div><label>要求完成</label><b>${s.due}</b></div></div><div class="samplefoot"><span>${s.loan?'借出中 · '+safe(s.loan.to):safe(s.location)}</span><button onclick="sampleIndex=${i};go('sampleDetail')">跟进打样${icon('arrow-right') function sampleDetailPage(){let s=currentSample();return header('SAMPLING WORK ORDER',s.code,`${styleData[s.style].code} / 第 ${s.version} 版 / ${s.color}`,`<button onclick="go('samples')">${icon('arrow-left')}返回样衣</button>`)+`<section class="panel pad" style="margin-bottom:20px"><div class="sampleflow">${sampleStages.map((t,i)=>`<div class="${i<s.stage?'done':i===s.stage?'current':''}"><span>${i<s.stage?icon('check'):i+1}</span><b>${t}</b></div>`).join('')}</div></section><div class="two"><div class="stack"><section class="panel pad"><div class="product"><div class="thumb">${icon('bom')}</div><div><span class="tag">${sampleStages[s.stage]}</span><h2>${safe(styleData[s.style].name)}</h2><p>${safe(s.color)} / ${s.size} / ${s.qty} 件</p></div></div><div class="samplefacts"><div><label>需求客户</label><button class="textbutton" onclick="partyKind='客户';partyIndex=${s.customer};go('party')">${safe(customers[s.customer].name)}${icon('arrow-right')}</button></div><div><label>承接厂家</label><b>${safe(factories[s.factory].name)}</b></div><div><label>负责人 / 交期</label><b>${safe(s.owner)} / ${s.due}</b></div><div><label>实物位置</label><b>${safe(s.location)}</b></div></div><div class="field" style="margin-top:20px"><label>打样要求</label><p>${safe(s.notes)}</p></div></section><section class="panel pad"><div style="display:flex;justify-content:space-between;align-items:center"><h2>试版资料与工艺</h2><span class="tag gray">试版 V0.${s.version}</span></div><div class="samplefacts"><div><label>用纱成分</label><b>${safe(styleData[s.style].composition)}</b></div><div><label>试版尺寸基准</label><b>${s.size} 码 / 以确认尺寸表为准</b></div></div><p style="margin-top:18px">每次重打建立新版本，保留原版工艺、试版 BOM 和修改原因；客户确认后封存资料，大货 BOM 另行发布。</p>${role!=='销售员'?`<button style="margin-top:18px" onclick="sampleTech()">${icon('orders')}查看试版资料</button>`:''}</section>${s.stage>=3?`<section class="panel pad"><h2>样衣制作工序</h2><div class="steps">${stageNames.map((t,i)=>`<div class="step ${i<s.progress?'done':i===s.progress?'now':''}"><div class="circle">${i<s.progress?icon('check'):i+1}</div>${t}</div>`).join('')}</div><p style="margin-top:20px">示例采用固定工序链路，完整记录在打样单内。</p></section>`:''}</div><div class="stack"><section class="panel pad"><h2>版本与操作记录</h2><div class="timeline">${s.logs.map(([t,d])=>`<div class="event">${safe(t)}<small>${safe(d)}</small></div>`).join('')}</div></section><section class="panel pad"><h2>样衣实物管理</h2><div class="samplefacts"><div><label>样衣数量</label><b>${s.qty} 件</b></div><div><label>当前去向</label><b>${s.loan?'借出中':'在制 / 在库'}</b></div></div>${s.loan?`<p style="margin-top:16px">借样方：${safe(s.loan.to)}<br>应还日期：${s.loan.due}</p>`:'<p style="margin-top:16px">封样完成后可登记借样与归还，不计入可销售库存。</p>'}</section></div></div>`+bottom('样衣开发流程为本次新增设计 · 操作仅更新演示状态',sampleEdit()?sampleActions(s):`<button onclick="go('samples')">返回样衣列表</button>`)}
function sampleActions(s){if(s.stage===6)return `${s.loan?`<button class="primary" onclick="returnSample()">${icon('shipping')}登记归还</button>`:`<button onclick="loanSample()">${icon('shipping')}借样登记</button>`}<button onclick="requestRevision()">${icon('edit')}新一版打样</button>`;if(s.stage===5)return `<button onclick="requestRevision()">${icon('edit')}客户退回修改</button><button class="primary" onclick="approveSample()">${icon('check')}客户确认并封样</button>`;if(s.stage===4)return `<button onclick="requestRevision()">质检不通过</button><button class="primary" onclick="passQuality()">${icon('check')}登记质检结果</button>`;return `<button class="primary" onclick="nextSampleStage()">${icon('arrow-right')}${['确认需求，进入工艺','确认试版资料','下达打样单','制作完成，送质检'][s.stage]}</button>`}
function newSample(){if(!sampleEdit())return;modal('新建打样需求',`<div class="fields"><div class="field"><label for="sampleCustomer">客户 *</label><select id="sampleCustomer">${customers.map((c,i)=>`<option value="${i}">${safe(c.name)}</option>`).join('')}</select></div><div class="field"><label for="sampleFactory">承接厂家 *</label><select id="sampleFactory">${factories.map((f,i)=>`<option value="${i}">${safe(f.name)}</option>`).join('')}</select></div><div class="field full"><label for="sampleStyle">款式 *</label><select id="sampleStyle">${styleData.map((s,i)=>`<option value="${i}">${safe(s.code+' / '+s.name)}</option>`).join('')}</select></div>${field('sampleColor','色号 / 色名 *','雾松绿')}<div class="field"><label for="sampleSize">样衣尺码</label><select id="sampleSize">${['S','M','L','XL'].map(x=>`<option ${x==='M'?'selected':''}>${x}</option>`).join('')}</select></div>${field('sampleQty','打样数量 / 件',1,'number')}${field('sampleDue','要求完成日期','2026-11-25','date')}<div class="field full"><label for="sampleNotes">版型 / 工艺要求 *</label><textarea id="sampleNotes" placeholder="描述打样目的、尺寸、用料或改版要求"></textarea></div></div><p id="sampleError" class="error"></p>`,'建立演示打样单','saveNewSample()')}

function linkedSample(d){return samples.filter(s=>s.style===d.style&&s.customer===d.customer).at(-1)}
function developmentStage(d){if(d.released)return 7;let s=linkedSample(d);return s?[1,2,3,3,4,5,6][s.stage]:d.stage}
const preDevNav=navList;navList=function(){return [['develop','bom','款式开发'],...preDevNav()]};
const preStyleList=styleList;styleList=function(){return `<div class="pad" style="padding-top:0"><p>款式档案与开发台账相互关联，点击款号跟进开发和打样。</p><button style="margin-top:15px" class="soft" onclick="go('develop')">${icon('bom')}打开款式开发列表</button></div><div class="devscroll"><table class="devtable"><thead><tr><th>款号 / 款式</th><th>品类</th><th>面料成分</th><th>色号数</th><th>档案</th></tr></thead><tbody>${styleData.map((s,i)=>`<tr><td><b>${safe(s.code)}</b><small>${safe(s.name)}</small></td><td>${safe(s.category)}</td><td>${safe(s.composition)}</td><td>${s.colors.length}</td><td><button onclick="openStyle(${i})">查看资料${icon('arrow-right')}</button></td></tr>`).join('')}</tbody></table></div>`};
function developPage(){return header('STYLE DEVELOPMENT CENTER','款式开发列表','以款号为主线，跟进从开发立项、打样修改到封样转大货的全过程。',sampleEdit()?`<button class="primary" onclick="newDevelopment()">${icon('plus')}新建款式开发</button>`:'')+`<section class="panel"><div class="panelhead"><div class="tabs">${['全部款式','开发打样中','待客户确认','已封样','已转大货'].map(t=>`<button class="${devFilter===t?'active':''}" onclick="devFilter='${t}';go('develop')">${t}</button>`).join('')}</div><span class="tag gray">列表视图</span></div><div class="toolbar"><div class="searchbox">${icon('search')}<input id="devQuery" aria-label="搜索开发款式" placeholder="搜索款号、名称、客户或厂家" oninput="renderDevelopment()"></div><select id="devSeason" aria-label="开发季节" onchange="renderDevelopment()"><option>全部季节</option><option>秋冬</option><option>春秋</option></select></div><div class="devscroll"><table class="devtable"><thead><tr><th>款号 / 款式名称</th><th>客户 / 厂家</th><th>开发阶段</th><th>打样版次</th><th>负责人 / 交期</th><th>下一步</th></tr></thead><tbody id="devRows"></tbody></table></div><div class="listfoot"><span id="devCount"></span><span>点击“跟进开发”查看完整开发档案</span></div></section><section class="panel pad" style="margin-top:20px"><div class="panelhead" style="padding:0"><h2>款式开发过程</h2><span class="tag gray">打样退回后进入新版本开发</span></div><div class="devflow">${devStages.map((s,i)=>`<div><span>${i+1}</span><b>${s}</b></div>`).join('')}</div></section>`+bottom('款式档案、打样单、版本记录与大货准备按款号关联',`<button onclick="go('samples')">${icon('sample')}查看打样单</button><button onclick="setMaster('款式档案')">${icon('orders')}款式基础资料</button>`)}
function renderDevelopment(){let q=document.getElementById('devQuery').value.toLowerCase(),season=document.getElementById('devSeason').value,a=developments.map((d,i)=>({d,i,stage:developmentStage(d)})).filter(({d,stage})=>{let s=styleData[d.style];return(role!=='销售员'||customers[d.customer].store==='杭州展厅')&&(s.code+s.name+customers[d.customer].name+factories[d.factory].name).toLowerCase().includes(q)&&(season==='全部季节'||s.season===season)&&(devFilter==='全部款式'||devFilter==='开发打样中'&&stage<5||devFilter==='待客户确认'&&stage===5||devFilter==='已封样'&&stage===6||devFilter==='已转大货'&&stage===7)});document.getElementById('devRows').innerHTML=a.map(({d,i,stage})=>{let s=styleData[d.style],sample=linkedSample(d);return `<tr><td><div class="devname"><div class="mini-shirt">${icon('bom')}</div><div><b>${safe(s.code)}</b><small>${safe(s.name)}</small><small>${safe(s.category)} · ${safe(s.season)}</small></div></div></td><td>${safe(customers[d.customer].name)}<small>${safe(factories[d.factory].name)}</small></td><td><span class="tag ${stage===5?'amber':stage>=6?'':'gray'}">${devStages[stage]}</span><div class="devprogress"><i style="width:${(stage+1)*12.5}%"></i></div></td><td>${sample?'第 '+sample.version+' 版':'尚未打样'}<small>${sample?sample.code:'待确认工艺'}</small></td><td>${safe(d.owner)}<small>${d.date}</small></td><td><button onclick="devIndex=${i};go('devDetail')">跟进开发${icon('arrow-right')}</button></td></tr>`}).join('')||'<tr><td colspan="6" class="blank">没有匹配的开发款式</td></tr>';document.getElementById('devCount').textContent=`共 ${a.length} 款 · 每个款式保留独立开发过程`}
function devDetailPage(){let d=developments[devIndex],s=styleData[d.style],sample=linkedSample(d),stage=developmentStage(d);return header('STYLE DEVELOPMENT FILE',s.code+' · '+s.name,'款式开发档案 / '+customers[d.customer].name,`<button onclick="go('develop')">${icon('arrow-left')}返回列表</button>`)+`<section class="panel pad" style="margin-bottom:20px"><div class="devflow">${devStages.map((t,i)=>`<div class="${i<stage?'done':i===stage?'current':''}"><span>${i<stage?icon('check'):i+1}</span><b>${t}</b></div>`).join('')}</div></section><div class="two"><div class="stack"><section class="panel pad"><div class="panelhead" style="padding:0"><h2>开发任务</h2><span class="tag">${devStages[stage]}</span></div><div class="samplefacts"><div><label>需求客户</label><b>${safe(customers[d.customer].name)}</b></div><div><label>承接厂家</label><b>${safe(factories[d.factory].name)}</b></div><div><label>负责人</label><b>${safe(d.owner)}</b></div><div><label>开发完成日期</label><b>${d.date}</b></div><div><label>面料 / 成分</label><b>${safe(s.composition)}</b></div><div><label>款式季节</label><b>${safe(s.season)}</b></div></div></section><section class="panel pad"><h2>设计与工艺记录</h2><p style="margin-top:15px">${safe(d.tech||'待填写版型、尺寸、针型、组织与工艺要求。')}</p><div class="devattachments"><span>${icon('bom')}款式图 / 参考图</span><span>${icon('orders')}尺寸表 / 工艺单</span></div><p>附件位置为设计示意，尚未上传真实文件。</p>${sampleEdit()?`<button style="margin-top:16px" onclick="developmentNotes('tech')">${icon('edit')}维护设计工艺</button>`:''}</section><section class="panel pad"><h2>试版 BOM 与用料</h2><p style="margin-top:15px">${safe(d.bom||'待确认试版用纱、色号、缸号、单件耗量、损耗与辅料。')}</p><div class="actions" style="margin-top:16px;flex-wrap:wrap">${sampleEdit()?`<button onclick="developmentNotes('bom')">${icon('edit')}记录试版用料</button>`:''}<button onclick="styleIndex=${d.style};bomColor=styleData[${d.style}].colors[0]||'待定';go('bom')">查看款式 BOM${icon('arrow-right')}</button></div></section><section class="panel pad"><h2>关联打样单</h2>${sample?`<button class="recordbutton" onclick="openDevelopmentSample()"><div class="recordicon">${icon('sample')}</div><span><b>${sample.code} · 第 ${sample.version} 版</b><small>${sampleStages[sample.stage]} · ${safe(sample.notes)}</small></span>${icon('arrow-right')}</button>`:'<p style="margin-top:16px">确认设计工艺和试版用料后，生成首版打样单。</p>'}</section></div><div class="stack"><section class="panel pad"><div class="eyebrow">NEXT ACTION</div><h2>${stage===7?'大货准备已登记':devStages[stage]+' · 待办'}</h2><p style="margin-top:15px">${['确认需求客户、承接厂家、季节与负责人。','整理款式图、尺寸标准、针型与工艺要求。','确认试版用纱、辅料、耗量及损耗口径。','按试版工艺制作样衣，记录工序完成情况。','检查尺寸、外观、色差与工艺，登记问题。','收集客户确认意见；不通过则建立新版。','冻结客户确认的样衣与资料，准备大货审核。','已登记转大货准备；仍需创建大货订单及审核正式 BOM。'][stage]}</p></section><section class="panel pad"><h2>开发过程与版本记录</h2><div class="timeline">${[...d.log,...(sample?sample.logs:[])].map(([t,n])=>`<div class="event">${safe(t)}<small>${safe(n)}</small></div>`).join('')}</div></section><div class="notice">${icon('orders')}<span>改版保留原记录。封样、转大货准备与正式投产分别确认，避免试版用料直接覆盖生产标准。</span></div></div></div>`+bottom('开发全过程按款号关联 · 演示数据不写入正式系统',`${sampleEdit()?devAction(d,stage,sample):`<button onclick="go('develop')">返回款式列表</button>`}`)}
function devAction(d,stage,sample){if(stage===7)return `<button onclick="go('orders')">查看大货订单${icon('arrow-right')}</button>`;if(stage===6)return `<button onclick="openDevelopmentSample()">查看封样</button><button class="primary" onclick="releaseDevelopment()">${icon('check')}登记转大货准备</button>`;if(sample)return `<button class="primary" onclick="openDevelopmentSample()">${icon('sample')}${stage===5?'处理客户确认':'进入打样流程'}</button>`;return `<button class="primary" onclick="advanceDevelopment()">${icon('arrow-right')}${['确认立项，开始设计','确认工艺，进入试版 BOM','生成首版打样单'][Math.min(stage,2)]}</button>`}
function openDevelopmentSample(){let s=linkedSample(developments[devIndex]);if(!s)return;sampleIndex=samples.indexOf(s);go('sampleDetail')}
function newDevelopment(){modal('新建款式开发',`<div class="fields">${field('devCode','款号 *','')}${field('devName','款式名称 *','')}<div class="field"><label for="devCustomer">客户</label><select id="devCustomer">${customers.map((c,i)=>`<option value="${i}">${safe(c.name)}</option>`).join('')}</select></div><div class="field"><label for="devFactory">厂家</label><select id="devFactory">${factories.map((f,i)=>`<option value="${i}">${safe(f.name)}</option>`).join('')}</select></div>${field('devOwner','负责人 *','林予安')}${field('devDate','计划完成日期 *','2026-11-25','date')}${field('devComposition','面料成分 / 方向','待确认')}<div class="field"><label for="devSeasonInput">开发季节</label><select id="devSeasonInput"><option>秋冬</option><option>春秋</option></select></div></div><p class="error" id="devError"></p>`,'建立开发档案','saveDevelopment()')}
function saveDevelopment(){if(!sampleEdit())return;let code=value('devCode'),name=value('devName'),owner=value('devOwner'),date=value('devDate');if(!code||!name||!owner||!date||date<'2026-11-14'||styleData.some(s=>s.code.toLowerCase()===code.toLowerCase())){document.getElementById('devError').textContent='请填写唯一款号、名称、负责人及不早于今日的计划日期。';return}styleData.push({code,name,category:'开发款',composition:value('devComposition'),season:value('devSeasonInput'),notes:'开发立项，待补充工艺。',colors:[],version:'待建立'});developments.push({style:styleData.length-1,customer:Number(value('devCustomer')),factory:Number(value('devFactory')),owner,date,stage:0,tech:'',bom:'',released:false,log:[['开发立项',code+' · '+owner+' · 已建立开发档案']]});devIndex=developments.length-1;closeModal();go('devDetail');toast('演示款式已进入开发立项')}
function developmentNotes(type){let d=developments[devIndex];modal(type==='tech'?'设计与工艺记录':'试版用料记录',`<div class="field" style="margin-top:20px"><label for="devNotes">${type==='tech'?'版型、尺寸、针型与工艺要求':'用纱、色号、缸号、耗量、损耗与辅料'}</label><textarea id="devNotes">${safe(d[type])}</textarea></div><p class="error" id="devError"></p>`,'保存开发记录',`saveDevNotes('${type}')`)}
function saveDevNotes(type){if(!sampleEdit())return;let n=value('devNotes');if(!n){document.getElementById('devError').textContent='请填写开发记录。';return}let d=developments[devIndex];d[type]=n;d.log.push([type==='tech'?'更新设计工艺':'更新试版用料',n]);closeModal();go('devDetail')}
function advanceDevelopment(){if(!sampleEdit())return;let d=developments[devIndex];if(d.stage===0){d.stage=1;d.log.push(['立项确认','进入设计与工艺阶段']);go('devDetail');return}if(d.stage===1){if(!d.tech){toast('请先记录设计与工艺要求');return}d.stage=2;d.log.push(['工艺确认','进入试版 BOM 阶段']);go('devDetail');return}if(!d.bom){toast('请先记录试版用料');return}modal('生成首版打样单',`<p>将当前客户、厂家、款号和开发交期带入首版打样单。</p><div class="fields">${field('devSampleColor','色号 / 色名 *','')}<div class="field"><label for="devSampleSize">样衣尺码</label><select id="devSampleSize"><option>S</option><option selected>M</option><option>L</option><option>XL</option></select></div>${field('devSampleQty','样衣数量 / 件',1,'number')}</div><p id="devError" class="error"></p>`,'生成演示打样单','createDevelopmentSample()')}
function createDevelopmentSample(){if(!sampleEdit())return;let d=developments[devIndex],color=value('devSampleColor'),qty=Number(value('devSampleQty'));if(!color||!Number.isInteger(qty)||qty<=0){document.getElementById('devError').textContent='请填写色号和正整数数量。';return}let code='DY261114-'+String(samples.length+1).padStart(3,'0');samples.push({code,style:d.style,customer:d.customer,factory:d.factory,color,size:value('devSampleSize'),qty,due:d.date,owner:d.owner,stage:2,version:1,progress:0,location:'待下达打样单',loan:null,notes:d.tech+'；试版用料：'+d.bom,logs:[['首版打样建立','从款式开发档案生成，等待正式下达']]});d.log.push(['生成首版打样单',code+' · 第 1 版']);sampleIndex=samples.length-1;closeModal();go('sampleDetail')}
function releaseDevelopment(){let d=developments[devIndex],s=linkedSample(d);if(!sampleEdit()||!s||s.stage!==6)return;modal('登记转大货准备',`<p>已确认封样：${s.code} / 第 ${s.version} 版</p><div class="field" style="margin-top:20px"><label for="releaseNotes">交接说明 *</label><textarea id="releaseNotes" placeholder="记录封样、正式 BOM 审核与大货订单准备情况"></textarea></div><p>此步骤只记录开发交接，不自动下生产工单或覆盖正式 BOM。</p><p id="devError" class="error"></p>`,'确认交接预览','confirmRelease()')}
function confirmRelease(){let n=value('releaseNotes');if(!n){document.getElementById('devError').textContent='请填写交接说明。';return}let d=developments[devIndex];d.released=true;d.log.push(['转大货准备',n]);closeModal();go('devDetail')}
const devGo=go;go=function(p){devGo(p);if(p==='develop')renderDevelopment()};

// Dedicated PC workspace: development and master-data maintenance stay here.
role='系统管理员';
navList=function(){return [['develop','bom','款号列表'],['samples','sample','开发与打样'],['master','materials','基础资料 / BOM'],['orders','orders','销售批次'],['warehouse','shipping','入库与发货'],['print','printer','单据中心']]};
const desktopDevelopmentPage=developPage;developPage=function(){return desktopDevelopmentPage().replace('款式开发列表','款号列表').replace('新建款式开发','新建开发款号')};
profilePage=function(){return header('ADMINISTRATOR','后台账号','款式开发与资料维护由 PC 后台统一管理。')+`<section class="panel pad"><h2>林予安 · 系统管理员</h2><p style="margin-top:18px">当前为后台设计预览，可维护款号、开发过程、打样、BOM、客户与厂家档案。</p></section>`};
setRole=function(){toast('当前为 PC 后台管理员预览')};

go('develop');
</script></body></html>
