const icon=(n)=>`<svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#i-${n}"></use></svg>`;

let route='orders',role='销售员',activeFilter='全部批次',selected=data[0],scanType='工序报工',scanned=false,warehouseType='发货登记',formSizes=[100,150,150,100],draft=false,printType='送货单',chosenColor='雾松绿';

function header(en,title,desc,actions=''){return `<div class="titleline"><div><div class="eyebrow">${en}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}

function navList(){return role==='销售员'?[['orders','orders','批次订单'],['new','plus','新增订货'],['scan','scan','扫码查询'],['print','printer','单据打印']]:role==='仓库管理员'?[['orders','orders','批次查询'],['scan','scan','扫码作业'],['warehouse','shipping','仓储发货'],['print','printer','单据打印']]:[['orders','orders','批次订单'],['new','plus','新增订货'],['scan','scan','扫码作业'],['print','printer','单据打印']]}
function go(p){route=p;if(p==='login'){document.getElementById('root').innerHTML=loginPage();return}let n=navList();document.getElementById('root').innerHTML=`<div class="shell"><aside class="rail"><div class="logo" title="梧桐朴鲤">${icon('brand')}</div><nav>${n.map(([id,ic,t])=>`<button class="${p===id||p==='detail'&&id==='orders'?'active':''}" onclick="go('${id}')">${icon(ic)}${t}</button>`).join('')}</nav><button class="account ${p==='profile'?'active':''}" onclick="go('profile')">${icon('team')}我的</button></aside><div class="workspace"><header class="top"><div><div class="wordmark">梧桐朴鲤</div><div class="subbrand">KNITWEAR WORKSPACE</div></div><div class="topright"><div class="connection">${icon('status')}演示模式</div><button class="profilebtn" onclick="go('profile')"><span class="avatar">林</span><span>林予安<small>${role} · ${role==='销售员'?'杭州展厅':'业务工作台'}</small></span>${icon('chevron-down')}</button></div></header><main>${({orders:ordersPage,new:newPage,detail:detailPage,scan:scanPage,warehouse:warehousePage,print:printPage,profile:profilePage,inventory:inventoryPage})[p]()}</main></div></div>`;if(p==='orders')filterRows();window.scrollTo(0,0)}
function ordersPage(){let a=scoped(),q=a.reduce((s,o)=>s+o.qty-o.sent,0),near=a.filter(o=>o.date<='11-17'&&o.qty>o.sent).length;return header('ORDER WORKSPACE','批次订单','2026年11月14日，星期六 · 让每一批交付都有着落。',`<button class="soft" onclick="refreshList()">${icon('refresh')}刷新</button>${role==='仓库管理员'?'':`<button class="primary" onclick="go('new')">${icon('plus')}新增订货</button>`}`)+`<div class="summary"><article><div><label>待发 / 欠货总数</label><strong>${number(q)}<small>件</small></strong><footer>订货总数 − 累计已发</footer></div>${icon('shipping')}</article><article><div><label>交期需关注</label><strong>${near}<small>个批次</small></strong><footer>逾期 1 · 临期 ${near-1}</footer></div>${icon('clock')}</article><article><div><label>跟进中的批次</label><strong>${a.filter(o=>o.qty>o.sent).length}<small>个</small></strong><footer>${role==='销售员'?'仅本人负责门店':'按岗位查看数据'}</footer></div>${icon('orders')}</article></div><section class="panel"><div class="panelhead"><div class="tabs">${['全部批次','交期预警','已完成'].map(t=>`<button class="${activeFilter===t?'active':''}" onclick="setFilter('${t}')">${t}</button>`).join('')}</div><span class="tag gray">${role==='销售员'?'我的门店':'全部门店'}</span></div><div class="toolbar"><div class="searchbox">${icon('search')}<input id="search" aria-label="搜索批次" placeholder="搜索批次号、客户、款号" oninput="filterRows()"></div><select id="status" aria-label="发货状态" onchange="filterRows()"><option>全部发货状态</option><option>未发</option><option>部分发货</option><option>全部发完</option></select><button class="soft" onclick="setFilter('全部批次')">重置</button></div><div class="orderscroll"><div class="gridhead"><span>批次 / 客户</span><span>款式 / 色号</span><span>交货日期</span><span>待发 / 件</span><span>发货状态</span><span></span></div><div id="orderrows"></div></div><div class="listfoot"><span id="rowcount"></span><span>第 1 页 · 每页 10 条</span></div></section>`+bottom('触控操作 · 点击行末按钮查看销售订单详情',`<button onclick="go('print')">${icon('printer')}打印单据</button><button class="primary" onclick="scanned=false;go('scan')">${icon('scan')}扫码进入</button>`)}
function status(o){return o.sent===o.qty?'全部发完':o.sent?'部分发货':'未发'}function setFilter(t){activeFilter=t;go('orders')}
function filterRows(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('status').value,a=scoped().filter(o=>(o.id+o.customer+o.style).toLowerCase().includes(q)&&(s==='全部发货状态'||s===status(o))&&(activeFilter==='全部批次'||activeFilter==='已完成'&&o.qty===o.sent||activeFilter==='交期预警'&&o.qty>o.sent&&o.date<='11-17'));document.getElementById('orderrows').innerHTML=a.map(o=>`<div class="orderrow ${o.date<'11-14'&&o.sent<o.qty?'overdue':''}"><div><b>${o.id}</b> ${o.urgent?'<span class="tag amber">急</span>':''}<small>${o.customer}</small></div><div><b>${o.style}</b><small>${o.color}</small></div><div><b ${o.date<'11-14'&&o.sent<o.qty?'style="color:var(--red)"':''}>2026-${o.date}</b><small>${o.sent===o.qty?'已交付':o.date<'11-14'?'逾期 1 天':o.date<='11-17'?'临近交期':'交期正常'}</small></div><div class="qty">${number(o.qty-o.sent)}</div><div><span class="tag ${o.sent===o.qty?'':o.sent?'amber':'gray'}">${status(o)}</span></div><button aria-label="查看 ${o.id} 详情" onclick="openDetail('${o.id}')">${icon('arrow-right')}</button></div>`).join('')||'<div class="blank">没有符合条件的批次，请调整筛选。</div>';document.getElementById('rowcount').textContent=`共 ${a.length} 个批次 · 待发 ${number(a.reduce((s,o)=>s+o.qty-o.sent,0))} 件`}
function refreshList(){filterRows();toast('已刷新演示列表')}function openDetail(id){selected=data.find(o=>o.id===id);go('detail')}
function detailPage(){let o=selected;return header('BATCH DETAIL',o.id,`${o.customer} · ${o.store}`,`<button onclick="go('orders')">${icon('arrow-left')}返回列表</button>`)+`<div class="two"><div class="stack"><section class="panel pad"><div class="product"><div class="thumb">${icon('bom')}</div><div><span class="tag ${o.urgent?'amber':'gray'}">${o.urgent?'加急批次':'普通批次'}</span><h2>${o.name}</h2><p>${o.style} / ${o.color} / S—XL</p></div></div><div class="metricstrip"><div><strong>${number(o.qty)}</strong><label>订货 / 件</label></div><div><strong>${number(o.sent)}</strong><label>已发 / 件</label></div><div><strong style="color:var(--red)">${number(o.qty-o.sent)}</strong><label>待发 / 欠货</label></div></div><div class="meta"><div><label>约定交期</label><b>2026-${o.date}</b></div><div><label>对接店员</label><b>林予安</b></div><div><label>发货状态</label><span class="tag amber">${status(o)}</span></div></div></section><section class="panel pad"><div style="display:flex;justify-content:space-between"><h2>生产进度</h2><span class="tag">${o.pct}% · ${stageNames[o.stage]||'已入库'}</span></div><div class="steps">${stageNames.map((s,i)=>`<div class="step ${i<o.stage?'done':i===o.stage?'now':''}"><div class="circle">${i<o.stage?icon('check'):i+1}</div>${s}<small>${i<o.stage?'已完成':i===o.stage?'进行中':'待开始'}</small></div>`).join('')}</div><p style="margin-top:22px">生产进度与发货状态分别追踪，欠货以实际发货记录为准。</p></section><section class="panel pad"><h2>尺码与数量</h2><div class="meta" style="grid-template-columns:repeat(4,1fr)">${['S','M','L','XL'].map((s,i)=>`<div><label>${s}</label><b>${o.qty*[.2,.3,.3,.2][i]} 件</b></div>`).join('')}</div></section></div><div class="stack"><div class="notice">${icon('clock')}<span>${o.qty===o.sent?'本批次已全部发完。':o.date<'11-14'?'此批次已逾期 1 天，请优先跟进剩余交付。':'请持续跟进工序进度与约定交期。'}</span></div><section class="panel pad"><h2>履约记录</h2><p style="margin-top:7px">${o.id} · 演示关联记录</p><div class="timeline">${o.sent>0?`<div class="event">已发货 ${number(o.sent)} 件<small>仓库登记 · 累计发货数量</small></div>`:''}<div class="event">${o.stage===6?'生产完成并入库':'当前工序：'+stageNames[o.stage]}<small>生产进度 ${o.pct}% · 工单汇总</small></div><div class="event">审单通过，关联款式 ${o.style}<small>跟单员 · BOM 版本冻结</small></div><div class="event">创建批次订单 ${number(o.qty)} 件<small>林予安 · ${o.store}</small></div></div></section><section class="panel pad"><h3>跟单备注</h3><p style="margin-top:12px">按确认样衣生产；同色优先使用同一缸号，包装按客户标准执行。</p></section></div></div>`+bottom('批次变更与业务操作需保留操作日志',`${role==='跟单员'?`<button onclick="editDelivery()">${icon('edit')}修改交期</button>`:''}<button class="primary" onclick="go('print')">${icon('printer')}打印此批次</button>`)}
function newPage(){return header('NEW ORDER','新增订货','选择客户与款式，按尺码录入本批次数量。',`<button onclick="go('orders')">${icon('arrow-left')}返回</button>`)+`<div class="two"><div class="stack"><section class="panel pad"><h2>01　客户与交期</h2><div class="fields"><div class="field"><label for="customer">客户</label><select id="customer"><option>杭州青禾服饰</option><option>南京木序商贸</option><option>南京木序商贸</option></select></div><div class="field"><label for="store">下单门店</label><select id="store"><option>杭州展厅</option>${role==='销售员'?'':'<option>上海展厅</option>'}</select></div><div class="field"><label for="orderDate">下单日期</label><input id="orderDate" type="date" value="2026-11-14"></div><div class="field"><label for="dueDate">交货日期</label><input id="dueDate" type="date" value="2026-11-25"></div></div></section><section class="panel pad"><h2>02　款式与色号</h2><div class="product" style="margin-top:20px"><div class="thumb">${icon('bom')}</div><div><span class="tag gray">款式档案</span><h2>羊绒混纺圆领衫</h2><p>WT-2608 · 10% 羊绒 / 90% 羊毛</p></div></div><div class="swatches">${[['雾松绿','#88997a'],['燕麦米','#d8ceb4'],['黑绷带','#414942']].map(([n,c])=>`<button class="${chosenColor===n?'selected':''}" onclick="chooseColor('${n}',this)"><span class="swatch" style="background:${c}"></span>${n}</button>`).join('')}</div></section></div><div class="stack"><section class="panel pad"><h2>03　尺码配比</h2><p style="margin-top:7px">可直接输入，或使用加减按钮调整。</p><div class="sizegrid">${['S','M','L','XL'].map((s,i)=>`<div class="sizebox"><label for="size${i}">${s}</label><input id="size${i}" type="number" min="0" step="1" value="${formSizes[i]}" oninput="updateQty()"><div class="stepperbuttons"><button aria-label="减少 ${s} 数量" onclick="adjustQty(${i},-10)">${icon('minus')}</button><button aria-label="增加 ${s} 数量" onclick="adjustQty(${i},10)">${icon('plus')}</button></div></div>`).join('')}</div><div class="total"><p>本批次订货总数</p><div><strong id="totalQty">${formSizes.reduce((a,b)=>a+b,0)}</strong> <span style="color:#8b9980">件</span></div></div><p id="qtyError" class="error"></p></section><section class="panel pad"><div class="field"><label for="remark">订单备注</label><textarea id="remark" placeholder="填写交付、工艺或包装要求"></textarea></div><label style="display:flex;align-items:center;gap:10px;margin-top:15px;font-size:12px"><input type="checkbox" id="urgent" style="width:22px;min-height:22px;height:22px;accent-color:#245747">设为加急批次</label></section><p>提交后由系统生成唯一批次号，数量按尺码明细汇总。</p></div></div>`+bottom('设计预览 · 表单不写入真实订单',`<button onclick="saveDraft()">${icon('orders')}暂存本次草稿</button><button class="primary" onclick="reviewOrder()">确认订货${icon('arrow-right')}</button>`)}
function chooseColor(c,el){chosenColor=c;document.querySelectorAll('.swatches button').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function updateQty(){formSizes=[0,1,2,3].map(i=>Number(document.getElementById('size'+i).value));let valid=formSizes.every(n=>Number.isInteger(n)&&n>=0);document.getElementById('totalQty').textContent=valid?number(formSizes.reduce((a,b)=>a+b,0)):'—';document.getElementById('qtyError').textContent=valid?'':'尺码数量必须为非负整数。'}
function adjustQty(i,d){let input=document.getElementById('size'+i);input.value=Math.max(0,(Number(input.value)||0)+d);updateQty()}

function salesCatalogRows(q){return salesCatalog.filter(s=>(s.code+s.name+s.color).toLowerCase().includes(q.toLowerCase())).map(s=>`<article class="sales-product"><div class="thumb">${icon('bom')}</div><div class="sales-product-name"><h2>${s.name}</h2><p>${s.code} / ${s.color}</p><p>${s.composition}</p></div><div class="sales-stock"><strong>${s.stock}</strong><p>件可售库存</p></div><button onclick="modal('款式规格','<p>${s.code} / ${s.name}<br>颜色：${s.color}<br>尺码：S / M / L / XL<br>库存：${s.stock} 件（演示）</p>')">查看规格${icon('arrow-right')}</button></article>`).join('')||'<div class="blank">暂无匹配款式</div>'}
function filterSalesCatalog(q){document.getElementById('salesCatalog').innerHTML=salesCatalogRows(q)}
detailPage=function(){let o=selected;return header('SALES ORDER DETAIL',o.id,o.customer+' / '+o.store,`<button onclick="go('orders')">${icon('arrow-left')}返回订单</button>`)+`<div class="two"><div class="stack"><section class="panel pad"><div class="product"><div class="thumb">${icon('bom')}</div><div><span class="tag ${o.urgent?'amber':'gray'}">${o.urgent?'加急订单':'普通订单'}</span><h2>${o.name}</h2><p>${o.style} / ${o.color}</p></div></div><div class="metricstrip"><div><strong>${number(o.qty)}</strong><label>订货 / 件</label></div><div><strong>${number(o.sent)}</strong><label>已发 / 件</label></div><div><strong style="color:var(--red)">${number(o.qty-o.sent)}</strong><label>待发 / 欠货</label></div></div><div class="meta"><div><label>约定交期</label><b>2026-${o.date}</b></div><div><label>对接店员</label><b>林予安</b></div><div><label>发货状态</label><span class="tag amber">${status(o)}</span></div></div></section><section class="panel pad"><h2>订货尺码</h2><div class="meta" style="grid-template-columns:repeat(4,1fr)">${['S','M','L','XL'].map((s,i)=>`<div><label>${s}</label><b>${o.qty*[.2,.3,.3,.2][i]} 件</b></div>`).join('')}</div></section><section class="panel pad"><h2>客户备注</h2><p style="margin-top:15px">按客户约定颜色与尺码交付，发货前核对收货信息。</p></section></div><section class="panel pad"><h2>销售履约记录</h2><div class="timeline">${o.sent?`<div class="event">累计已发 ${number(o.sent)} 件<small>按发货记录汇总</small></div>`:''}<div class="event">${o.qty===o.sent?'已完成交付':'待交付 '+number(o.qty-o.sent)+' 件'}<small>约定交期 2026-${o.date}</small></div><div class="event">订货数量确认 ${number(o.qty)} 件<small>${o.customer} / ${o.store}</small></div></div></section></div>`+bottom('销售订单只读跟进，发货记录由后台更新',`<button onclick="go('inventory')">查看款式库存</button><button class="primary" onclick="go('print')">${icon('printer')}打印销售单据</button>`)};
scanPage=function(){return header('SCAN PRODUCT','扫码查询','扫描销售款号，查询颜色、规格与可售库存。')+`<div class="two"><section class="panel pad"><div class="scanview">${icon('scan')}<div class="scanline"></div><p>将款号条码放入识别区域</p><span class="tag gray">相机区域 · 设计示意</span></div><div style="display:flex;gap:10px;margin-top:20px"><input id="manualCode" aria-label="销售款号" placeholder="输入款号，例如 WT-2608" style="min-width:0;width:100%"><button onclick="salesScan()">查询</button></div><button class="soft" style="width:100%;margin-top:12px" onclick="document.getElementById('manualCode').value='WT-2608';salesScan()">模拟识别款号</button><p class="error" id="scanError"></p></section><section class="panel pad" id="salesScanResult"><div class="empty-state">${icon('search')}<h2>等待识别销售款号</h2><p>识别后显示款式与库存信息。</p></div></section></div>`+bottom('扫码仅用于销售查询',`<button onclick="go('orders')">返回客户订单</button>`)};
function salesScan(){let s=salesCatalog.find(s=>s.code===document.getElementById('manualCode').value.trim().toUpperCase());if(!s){document.getElementById('scanError').textContent='未找到演示款号，可输入 WT-2608 或 WT-2605。';return}document.getElementById('scanError').textContent='';document.getElementById('salesScanResult').innerHTML=`<span class="tag">${icon('check')}查询成功</span><h2 style="margin:22px 0 12px">${s.name}</h2><p>${s.code} / ${s.color}<br>${s.composition}</p><div class="largeqty">${s.stock} <small style="font-size:14px">件可售库存</small></div><p>S / M / L / XL · 演示库存</p><button class="primary" style="width:100%;margin-top:25px" onclick="go('new')">进入销售开单</button>`}
const salesBaseGo=go;go=function(p){role='销售员';if(!['orders','detail','new','inventory','scan','print','profile','login'].includes(p))p='orders';salesBaseGo(p)};

go('orders');
</script></body></html>
